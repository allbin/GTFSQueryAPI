apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: go-gtfs-query-api
  name: go-gtfs-query-api
  namespace: gtfs-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-gtfs-query-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: go-gtfs-query-api
    spec:
      restartPolicy: Always
      containers:
        - image: europe-west3-docker.pkg.dev/allbinary-204807/gtfs/gtfs-query-api
          name: go-gtfs-query-api
          envFrom:
            - secretRef:
                name: go-gtfs-query-api-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
        - image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3
          name: cloudsql-proxy
          command:
            [
              "/cloud-sql-proxy",
              "--credentials-file=/secrets/cloudsql/credentials.json",
              "--structured-logs",
              "--port=5432",
              "--health-check",
              "--http-address=0.0.0.0",
              "--http-port=9090",
              "allbinary-204807:europe-west3:transport-gtfs",
            ]
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /liveness
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 2
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: cloud-sql-credentials
              mountPath: /secrets/cloudsql
              readOnly: true
      volumes:
        - name: cloud-sql-credentials
          secret:
            defaultMode: 420
            secretName: cloudsql-transport-credentials
